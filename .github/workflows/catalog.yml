name: Publish catalog + website

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', '.github/workflows/catalog.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build catalog
        run: |
          mkdir -p public
          cp -r site/. public/
          node scripts/build-catalog.mjs --out public/catalog.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
